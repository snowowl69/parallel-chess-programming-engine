<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess AI Platform - Play Chess</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <div class="logo-section">
                <div class="logo"><i class="fas fa-chess-king"></i></div>
                <div class="nav-title">Chess AI Platform - Play Chess</div>
            </div>
            <nav class="nav-links">
                <a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a>
                <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </div>
    </header>

    <div class="main-container grid-3col">
        <!-- Left sidebar - Game Setup & Info -->
        <div class="game-sidebar glass-panel">
            <h3><i class="fas fa-gamepad"></i> Game Setup</h3>
            <div class="game-setup" id="gameSetup">
                <div class="form-group">
                    <label for="colorChoice">Your Color:</label>
                    <select id="colorChoice">
                        <option value="white">White (First Move)</option>
                        <option value="black">Black (Second Move)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="difficultyChoice">AI Difficulty:</label>
                    <select id="difficultyChoice">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <button class="btn btn-success" onclick="startNewGame()"><i class="fas fa-rocket"></i> Start New Game</button>
            </div>

            <div class="status-display" id="gameStatus">
                Click "Start New Game" to begin!
            </div>

            <div class="game-controls hidden" id="gameControls" style="display: flex; flex-direction: column; gap: 1rem;">
                <button class="btn btn-danger" onclick="resignGame()"><i class="fas fa-flag"></i> Resign</button>
                <button class="btn btn-primary" onclick="offerDraw()"><i class="fas fa-handshake"></i> Offer Draw</button>
            </div>
        </div>

        <!-- Center - Chess Board -->
        <div class="chess-board-container">
            <div class="chess-board" id="chessBoard">
                <!-- Board squares will be generated by JavaScript -->
            </div>
            
            <div class="game-info glass-panel">
                <div id="turnIndicator"><i class="fas fa-bullseye"></i> Ready to Play</div>
            </div>
        </div>

        <!-- Right sidebar - Move History & Statistics -->
        <div class="game-sidebar glass-panel">
            <h3><i class="fas fa-clipboard-list"></i> Move History</h3>
            <div class="move-history">
                <div class="move-list" id="moveList">
                    <!-- Moves will be populated here -->
                </div>
            </div>

            <div style="margin-top: 20px;">
                <h4><i class="fas fa-trophy"></i> Your Statistics</h4>
                <div id="userStats">
                    Loading statistics...
                </div>
            </div>
        </div>
    </div>

    <!-- Promotion Dialog -->
    <div id="promotionDialog" class="promotion-dialog hidden" onclick="cancelPromotion(event)">
        <div class="promotion-choices" onclick="event.stopPropagation()">
            <div class="promotion-title">Choose Promotion Piece</div>
            <div class="promotion-pieces-row">
                <div class="promotion-piece" data-piece="q" data-name="Queen" onclick="selectPromotion('q')"><i class="fas fa-chess-queen"></i></div>
                <div class="promotion-piece" data-piece="r" data-name="Rook" onclick="selectPromotion('r')"><i class="fas fa-chess-rook"></i></div>
                <div class="promotion-piece" data-piece="b" data-name="Bishop" onclick="selectPromotion('b')"><i class="fas fa-chess-bishop"></i></div>
                <div class="promotion-piece" data-piece="n" data-name="Knight" onclick="selectPromotion('n')"><i class="fas fa-chess-knight"></i></div>
            </div>
            <div style="margin-top: 15px; text-align: center; color: #666; font-size: 0.9em;">
                Click outside to cancel
            </div>
        </div>
    </div>

    <script>
        // Chess game state
        let gameState = {
            board: null,
            currentFen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
            userColor: 'white',
            difficulty: 'medium',
            moves: [],
            gameActive: false,
            selectedSquare: null,
            gameId: null,
            pendingMove: null
        };

        // Unicode chess pieces
        const pieces = {
            'K': '<i class="fas fa-chess-king chess-piece-icon white-piece"></i>',
            'Q': '<i class="fas fa-chess-queen chess-piece-icon white-piece"></i>',
            'R': '<i class="fas fa-chess-rook chess-piece-icon white-piece"></i>',
            'B': '<i class="fas fa-chess-bishop chess-piece-icon white-piece"></i>',
            'N': '<i class="fas fa-chess-knight chess-piece-icon white-piece"></i>',
            'P': '<i class="fas fa-chess-pawn chess-piece-icon white-piece"></i>',
            'k': '<i class="fas fa-chess-king chess-piece-icon black-piece"></i>',
            'q': '<i class="fas fa-chess-queen chess-piece-icon black-piece"></i>',
            'r': '<i class="fas fa-chess-rook chess-piece-icon black-piece"></i>',
            'b': '<i class="fas fa-chess-bishop chess-piece-icon black-piece"></i>',
            'n': '<i class="fas fa-chess-knight chess-piece-icon black-piece"></i>',
            'p': '<i class="fas fa-chess-pawn chess-piece-icon black-piece"></i>'
        };

        // Initialize the chess board
        function initializeBoard() {
            const boardElement = document.getElementById('chessBoard');
            boardElement.innerHTML = '';

            for (let rank = 7; rank >= 0; rank--) {
                for (let file = 0; file < 8; file++) {
                    const square = document.createElement('div');
                    square.className = `chess-square ${(rank + file) % 2 === 0 ? 'dark' : 'light'}`;
                    square.dataset.rank = rank;
                    square.dataset.file = file;
                    square.dataset.square = String.fromCharCode(97 + file) + (rank + 1);
                    square.addEventListener('click', handleSquareClick);
                    boardElement.appendChild(square);
                }
            }
        }

        // Update board display with pieces
        function updateBoard() {
            const squares = document.querySelectorAll('.chess-square');
            const fenBoard = gameState.currentFen.split(' ')[0];
            const ranks = fenBoard.split('/');

            squares.forEach(square => {
                square.innerHTML = '';
                square.classList.remove('selected', 'possible-move', 'last-move');
            });

            ranks.forEach((rank, rankIndex) => {
                let fileIndex = 0;
                for (let char of rank) {
                    if (isNaN(char)) {
                        // It's a piece
                        const square = document.querySelector(`[data-rank="${7-rankIndex}"][data-file="${fileIndex}"]`);
                        if (square) {
                            square.innerHTML = `<span class="piece">${pieces[char] || ''}</span>`;
                        }
                        fileIndex++;
                    } else {
                        // It's a number (empty squares)
                        fileIndex += parseInt(char);
                    }
                }
            });
        }

        // Handle square clicks
        function handleSquareClick(event) {
            if (!gameState.gameActive) return;

            const square = event.currentTarget;
            const squareNotation = square.dataset.square;

            if (gameState.selectedSquare === squareNotation) {
                // Deselect
                gameState.selectedSquare = null;
                updateBoard();
                return;
            }

            if (gameState.selectedSquare) {
                // Try to make a move
                const fromSquare = gameState.selectedSquare;
                const toSquare = squareNotation;
                
                // Check if this is a pawn promotion move
                if (isSimplePawnPromotion(fromSquare, toSquare)) {
                    gameState.pendingMove = { from: fromSquare, to: toSquare };
                    showPromotionDialog();
                } else {
                    const move = fromSquare + toSquare;
                    makeMove(move);
                }
                
                gameState.selectedSquare = null;
                updateBoard(); // Clear highlights
            } else {
                // Select piece
                if (square.innerHTML !== '') {
                    gameState.selectedSquare = squareNotation;
                    square.classList.add('selected');
                    showPossibleMoves(squareNotation);
                }
            }
        }

        // Show possible moves for selected piece
        async function showPossibleMoves(fromSquare) {
            try {
                const response = await fetch('/api/get_legal_moves', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        from_square: fromSquare,
                        fen: gameState.currentFen
                    })
                });

                const data = await response.json();
                if (data.success && data.moves) {
                    // Highlight possible move squares
                    data.moves.forEach(move => {
                        const toSquare = move.substring(2, 4); // Extract destination square
                        const square = document.querySelector(`[data-square="${toSquare}"]`);
                        if (square) {
                            square.classList.add('possible-move');
                        }
                    });
                }
            } catch (error) {
                console.error('Error getting legal moves:', error);
            }
        }

        // Simple client-side pawn promotion check
        function isSimplePawnPromotion(fromSquare, toSquare) {
            if (!fromSquare || !toSquare || !gameState.gameActive) {
                return false;
            }
            
            const fromRank = parseInt(fromSquare[1]) - 1;
            const toRank = parseInt(toSquare[1]) - 1;
            
            // Get the piece on the from square
            const fenBoard = gameState.currentFen.split(' ')[0];
            const ranks = fenBoard.split('/');
            const fromFile = fromSquare.charCodeAt(0) - 97;
            
            let fileIndex = 0;
            const rankData = ranks[7 - fromRank];
            for (let char of rankData) {
                if (isNaN(char)) {
                    if (fileIndex === fromFile) {
                        const piece = char.toLowerCase();
                        // Check if it's a pawn reaching the back rank
                        if (piece === 'p') {
                            if (char === 'P' && toRank === 7) return true; // White pawn to 8th rank
                            if (char === 'p' && toRank === 0) return true; // Black pawn to 1st rank
                        }
                        break;
                    }
                    fileIndex++;
                } else {
                    fileIndex += parseInt(char);
                    if (fileIndex > fromFile) break;
                }
            }
            return false;
        }

        // Check if a move is a pawn promotion
        async function isPawnPromotion(fromSquare, toSquare) {
            try {
                // First check if this move would be a promotion
                const response = await fetch('/api/check_promotion', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        from_square: fromSquare,
                        to_square: toSquare,
                        fen: gameState.currentFen
                    })
                });

                const data = await response.json();
                return data.is_promotion === true;
            } catch (error) {
                console.error('Error checking promotion:', error);
                
                // Fallback to client-side check
                const fromRank = parseInt(fromSquare[1]) - 1;
                const toRank = parseInt(toSquare[1]) - 1;
                
                // Get the piece on the from square
                const fenBoard = gameState.currentFen.split(' ')[0];
                const ranks = fenBoard.split('/');
                const fromFile = fromSquare.charCodeAt(0) - 97;
                
                let fileIndex = 0;
                const rankData = ranks[7 - fromRank];
                for (let char of rankData) {
                    if (isNaN(char)) {
                        if (fileIndex === fromFile) {
                            const piece = char.toLowerCase();
                            // Check if it's a pawn reaching the back rank
                            if (piece === 'p') {
                                if (char === 'P' && toRank === 7) return true; // White pawn to 8th rank
                                if (char === 'p' && toRank === 0) return true; // Black pawn to 1st rank
                            }
                            break;
                        }
                        fileIndex++;
                    } else {
                        fileIndex += parseInt(char);
                        if (fileIndex > fromFile) break;
                    }
                }
                return false;
            }
        }

        // Show promotion dialog
        function showPromotionDialog() {
            // Safety check - only show if there's a pending move and game is active
            if (!gameState.pendingMove || !gameState.gameActive) {
                console.log('Promotion dialog blocked - no pending move or game not active');
                return;
            }
            
            const dialog = document.getElementById('promotionDialog');
            const pieces = dialog.querySelectorAll('.promotion-piece');
            
            // Determine the color of the promoting pawn
            const fromSquare = gameState.pendingMove.from;
            const fromFile = fromSquare.charCodeAt(0) - 97;
            const fromRank = parseInt(fromSquare[1]) - 1;
            
            const fenBoard = gameState.currentFen.split(' ')[0];
            const ranks = fenBoard.split('/');
            
            let promotingPieceColor = 'white'; // default
            let fileIndex = 0;
            const rankData = ranks[7 - fromRank];
            for (let char of rankData) {
                if (isNaN(char)) {
                    if (fileIndex === fromFile) {
                        promotingPieceColor = (char === char.toUpperCase()) ? 'white' : 'black';
                        break;
                    }
                    fileIndex++;
                } else {
                    fileIndex += parseInt(char);
                    if (fileIndex > fromFile) break;
                }
            }
            
            // Update pieces to show correct color
            pieces.forEach(piece => {
                const pieceType = piece.dataset.piece;
                if (promotingPieceColor === 'white') {
                    piece.innerHTML = {q: '<i class="fas fa-chess-queen white-piece"></i>', r: '<i class="fas fa-chess-rook white-piece"></i>', b: '<i class="fas fa-chess-bishop white-piece"></i>', n: '<i class="fas fa-chess-knight white-piece"></i>'}[pieceType];
                } else {
                    piece.innerHTML = {q: '<i class="fas fa-chess-queen black-piece"></i>', r: '<i class="fas fa-chess-rook black-piece"></i>', b: '<i class="fas fa-chess-bishop black-piece"></i>', n: '<i class="fas fa-chess-knight black-piece"></i>'}[pieceType];
                }
            });
            
            dialog.classList.remove('hidden');
            dialog.style.display = 'flex'; // Explicitly show
        }

        // Handle promotion piece selection
        function selectPromotion(piece) {
            const dialog = document.getElementById('promotionDialog');
            dialog.classList.add('hidden');
            dialog.style.display = 'none'; // Explicitly hide
            
            const move = gameState.pendingMove.from + gameState.pendingMove.to + piece;
            makeMove(move);
            gameState.pendingMove = null;
        }

        // Cancel promotion dialog
        function cancelPromotion(event) {
            if (event.target.id === 'promotionDialog') {
                const dialog = document.getElementById('promotionDialog');
                dialog.classList.add('hidden');
                dialog.style.display = 'none'; // Explicitly hide
                gameState.pendingMove = null;
                
                // Clear any selection
                gameState.selectedSquare = null;
                updateBoard();
            }
        }

        // Start a new game
        async function startNewGame() {
            gameState.userColor = document.getElementById('colorChoice').value;
            gameState.difficulty = document.getElementById('difficultyChoice').value;

            try {
                const response = await fetch('/api/new_game', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        color: gameState.userColor,
                        difficulty: gameState.difficulty
                    })
                });

                const data = await response.json();
                if (data.success) {
                    gameState.gameActive = true;
                    gameState.currentFen = data.game_state.fen;
                    gameState.moves = data.game_state.moves || [];
                    gameState.gameId = data.game_state.game_id;
                    gameState.pendingMove = null; // Clear any pending moves
                    gameState.selectedSquare = null; // Clear selection
                    
                    // Hide promotion dialog if it's showing
                    const promotionDialog = document.getElementById('promotionDialog');
                    promotionDialog.classList.add('hidden');
                    promotionDialog.style.display = 'none';

                    updateBoard();
                    updateGameStatus('Game started! Your turn.');
                    document.getElementById('gameSetup').classList.add('hidden');
                    document.getElementById('gameControls').classList.remove('hidden');
                    updateMoveHistory();
                } else {
                    alert('Failed to start game: ' + data.error);
                }
            } catch (error) {
                console.error('Error starting game:', error);
                alert('Error starting game');
            }
        }

        // Make a move
        async function makeMove(moveUci) {
            if (!gameState.gameActive) return;

            try {
                const response = await fetch('/api/make_move', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        move: moveUci,
                        fen: gameState.currentFen,
                        game_id: gameState.gameId
                    })
                });

                const data = await response.json();
                if (data.success) {
                    gameState.currentFen = data.fen;
                    if (data.moves) {
                        gameState.moves.push(...data.moves);
                    }
                    updateBoard();
                    updateMoveHistory();

                    if (data.game_over) {
                        endGame(data.result);
                    } else {
                        updateGameStatus(data.ai_move ? `AI played: ${data.ai_move}. Your turn!` : 'Your turn!');
                    }
                } else {
                    // Check if error is about promotion needed
                    if (data.error && data.error.includes('promotion') || data.error && data.error.includes('pawn')) {
                        // Extract from/to squares from the moveUci
                        if (moveUci.length >= 4) {
                            const fromSquare = moveUci.substring(0, 2);
                            const toSquare = moveUci.substring(2, 4);
                            gameState.pendingMove = { from: fromSquare, to: toSquare };
                            showPromotionDialog();
                        }
                    } else {
                        alert('Error making move: ' + (data.error || 'Unknown error'));
                    }
                }
            } catch (error) {
                console.error('Error making move:', error);
                alert('Error making move: ' + error.message);
            }
        }

        // Update game status
        function updateGameStatus(message, isGameOver = false) {
            const statusElement = document.getElementById('gameStatus');
            statusElement.innerHTML = message;
            
            if (isGameOver) {
                statusElement.classList.add('game-over');
            } else {
                statusElement.classList.remove('game-over');
            }
        }

        // End game
        function endGame(result) {
            gameState.gameActive = false;
            let message = '';
            
            if (result === '1-0') {
                if (gameState.userColor === 'white') {
                    message = '<i class="fas fa-award"></i> Congratulations! You won the game!';
                } else {
                    message = '<i class="fas fa-frown"></i> Game Over! AI (White) won this time.';
                }
            } else if (result === '0-1') {
                if (gameState.userColor === 'black') {
                    message = '<i class="fas fa-award"></i> Congratulations! You won the game!';
                } else {
                    message = '<i class="fas fa-frown"></i> Game Over! AI (Black) won this time.';
                }
            } else if (result === '1/2-1/2') {
                message = '<i class="fas fa-handshake"></i> Game ended in a draw! Well played!';
            } else {
                message = '<i class="fas fa-flag-checkered"></i> Game Over!';
            }

            updateGameStatus(message, true);
            document.getElementById('gameSetup').classList.remove('hidden');
            document.getElementById('gameControls').classList.add('hidden');
            loadUserStats();
        }

        // Update move history
        function updateMoveHistory() {
            const moveList = document.getElementById('moveList');
            moveList.innerHTML = '';

            for (let i = 0; i < gameState.moves.length; i += 2) {
                const moveNumber = Math.floor(i / 2) + 1;
                const whiteMove = gameState.moves[i] || '';
                const blackMove = gameState.moves[i + 1] || '';
                
                moveList.innerHTML += `
                    <div class="move-number">${moveNumber}.</div>
                    <div class="move-item">${whiteMove}</div>
                    <div class="move-item">${blackMove}</div>
                `;
            }
        }

        // Resign game
        function resignGame() {
            if (confirm('Are you sure you want to resign?')) {
                gameState.gameActive = false;
                updateGameStatus('<i class="fas fa-flag"></i> You resigned. Game Over.', true);
                document.getElementById('gameSetup').classList.remove('hidden');
                document.getElementById('gameControls').classList.add('hidden');
            }
        }

        // Offer draw
        function offerDraw() {
            if (confirm('Offer a draw?')) {
                // For now, just accept the draw
                gameState.gameActive = false;
                updateGameStatus('<i class="fas fa-handshake"></i> Draw agreed. Game Over.', true);
                document.getElementById('gameSetup').classList.remove('hidden');
                document.getElementById('gameControls').classList.add('hidden');
            }
        }

        // Load user statistics
        async function loadUserStats() {
            try {
                const response = await fetch('/api/game_history');
                const data = await response.json();
                
                if (data.games) {
                    const stats = calculateStats(data.games);
                    document.getElementById('userStats').innerHTML = `
                        <div><i class="fas fa-chart-bar"></i> Games: ${stats.total}</div>
                        <div><i class="fas fa-trophy"></i> Wins: ${stats.wins}</div>
                        <div><i class="fas fa-frown"></i> Losses: ${stats.losses}</div>
                        <div><i class="fas fa-handshake"></i> Draws: ${stats.draws}</div>
                        <div><i class="fas fa-chart-line"></i> Win Rate: ${stats.winRate}%</div>
                    `;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Calculate statistics
        function calculateStats(games) {
            const total = games.length;
            let wins = 0, losses = 0, draws = 0;

            games.forEach(game => {
                if (game.result === '1-0') {
                    if (game.user_color === 'white') wins++;
                    else losses++;
                } else if (game.result === '0-1') {
                    if (game.user_color === 'black') wins++;
                    else losses++;
                } else {
                    draws++;
                }
            });

            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;

            return { total, wins, losses, draws, winRate };
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initializeBoard();
            updateBoard();
            loadUserStats();
            
            // Ensure promotion dialog is hidden on page load
            const promotionDialog = document.getElementById('promotionDialog');
            if (promotionDialog) {
                promotionDialog.classList.add('hidden');
                promotionDialog.style.display = 'none';
            }
            
            // Force hide promotion dialog every 100ms for the first 5 seconds
            let hideAttempts = 0;
            const forceHideInterval = setInterval(() => {
                const dialog = document.getElementById('promotionDialog');
                if (dialog && !gameState.gameActive) {
                    dialog.classList.add('hidden');
                    dialog.style.display = 'none';
                }
                hideAttempts++;
                if (hideAttempts > 50) { // Stop after 5 seconds
                    clearInterval(forceHideInterval);
                }
            }, 100);
        });

        // Add keyboard event listener for Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const dialog = document.getElementById('promotionDialog');
                if (!dialog.classList.contains('hidden')) {
                    dialog.classList.add('hidden');
                    dialog.style.display = 'none';
                    gameState.pendingMove = null;
                    gameState.selectedSquare = null;
                    updateBoard();
                }
            }
        });
    </script>
</body>
</html>
